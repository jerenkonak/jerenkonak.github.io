# Your bio/about content (supports Markdown)
content: |
  I am a **Ph.D. student in Operations Research** at the
  [Georgia Institute of Technology](https://www.gatech.edu/),
  based in the [H. Milton Stewart School of Industrial and Systems Engineering](https://www.isye.gatech.edu/).
  My research centers on **mathematical optimization** and **algorithm design**, with a specific focus on
  developing large-scale **mixed-integer optimization models** for freight consolidation. I am particularly
  interested in tackling **Vehicle Routing Problems (CVRP)**, the **Traveling Salesperson Problem (TSP)**,
  and designing **approximation algorithms**.

  <hr class="bio-separator">

  Before coming to Georgia Tech, I earned my **M.Eng. in Computer Science** and my
  **B.S. in Operations Research and Information Engineering** from
  [Cornell University](https://www.cornell.edu/).

  <hr class="bio-separator">

