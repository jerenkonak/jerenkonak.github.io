# Your bio/about content (supports Markdown)
content: |
  I am a Ph.D. student in Operations Research at Georgia Tech, advised by
  [Alan Erera](https://www2.isye.gatech.edu/faculty/Alan_Erera/).
  My research centers on mathematical optimization and algorithm design, with a specific focus on
  developing large-scale mixed-integer optimization models for last-mile freight consolidation.

  Before coming to Georgia Tech, I earned my M.Eng. in Computer Science and my
  B.S. in Operations Research and Information Engineering from
  [Cornell University](https://www.cornell.edu/).

  Please refer to my CV (pdf) which summarizes my work to date.


